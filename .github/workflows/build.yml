name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: engine
        run: cmake -G Xcode -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -S . -B build-ci-ios

      - name: Build
        working-directory: engine
        run: xcodebuild -project build-ci-ios/markmos.xcodeproj -scheme markmos_game -configuration Debug -destination generic/platform=iOS-simulator build

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build
        working-directory: project/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: engine
        run: cmake -G Xcode -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -S . -B build-ci-macos

      - name: Build
        working-directory: engine
        run: xcodebuild -project build-ci-macos/markmos.xcodeproj -scheme backend_concept_tests -configuration Debug build

      - name: Test
        working-directory: engine
        run: xcodebuild -project build-ci-macos/markmos.xcodeproj -scheme backend_concept_tests -configuration Debug test
